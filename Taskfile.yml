version: "3"

# Every binary this repo builds lands in dist/, which is the only build
# artifact path .gitignore hides. Building to the repo root is what put a
# 59 MB binary inside the wadjet/ PACKAGE directory (go writes into a
# directory of that name rather than refusing) and required ignoring
# /wadjet — which then hid new source files in that package from
# `git status` entirely. Two test files were written, never shown as
# untracked, and never committed before that was noticed.
vars:
  DIST: dist

tasks:
  build:
    desc: Build the wadjet binary into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/wadjet ./cmd/wadjet

  build-all:
    desc: Build every command into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/ ./cmd/...

  build-ingest:
    desc: Build the unifi-ingest binary into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/unifi-ingest ./cmd/unifi-ingest

  clean:
    desc: Remove built binaries
    cmds:
      - rm -rf {{.DIST}}

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./internal/...

  test-race:
    desc: Run unit tests with race detector
    cmds:
      - go test -race ./internal/...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -run=^$ ./internal/engine/... ./internal/worker/...

  proto:
    desc: Regenerate protobuf and gRPC Go code (public + internal)
    cmds:
      - protoc -I=proto --go_out=gen --go_opt=paths=source_relative --go-grpc_out=gen --go-grpc_opt=paths=source_relative wadjet/v1/wadjet.proto
      - protoc -I=proto --go_out=gen --go_opt=paths=source_relative --go-grpc_out=gen --go-grpc_opt=paths=source_relative dataplane/v1/dataplane.proto dataplane/v1/peer.proto

  check:
    desc: Run vet, lint, and tests
    cmds:
      - task: vet
      - task: lint
      - task: test

  # --- Benchmark deploy pipeline ---
  # Usage:
  #   task bench:stage PROFILE=sf100-distributed     # Build + upload binaries
  #   task bench:deploy PROFILE=sf100-distributed    # Stage + terraform apply
  #   task bench:teardown                             # Destroy infrastructure
  #   task bench:ssh                                  # SSM into coordinator

  bench:stage:
    desc: Cross-compile and stage binaries + profiles to S3
    requires:
      vars: [PROFILE]
    vars:
      BUCKET:
        sh: 'python3 -c "import yaml; p=yaml.safe_load(open(''deploy/benchmark/profiles/{{.PROFILE}}.yaml'')); print(p[''storage''][''bucket''])"'
      REGION:
        sh: 'python3 -c "import yaml; p=yaml.safe_load(open(''deploy/benchmark/profiles/{{.PROFILE}}.yaml'')); print(p[''storage''][''region''])"'
    cmds:
      - ./deploy/benchmark/stage-binaries.sh {{.BUCKET}} {{.REGION}}

  bench:deploy:
    desc: Stage binaries and deploy benchmark cluster from profile
    requires:
      vars: [PROFILE]
    cmds:
      - task: bench:stage
        vars: { PROFILE: "{{.PROFILE}}" }
      - cd deploy/benchmark/terraform && tofu apply -var="profile={{.PROFILE}}"

  bench:plan:
    desc: Show terraform plan for a benchmark profile (dry run)
    requires:
      vars: [PROFILE]
    cmds:
      - cd deploy/benchmark/terraform && tofu plan -var="profile={{.PROFILE}}"

  bench:teardown:
    desc: Destroy benchmark infrastructure
    cmds:
      - cd deploy/benchmark/terraform && tofu destroy

  bench:ssh:
    desc: SSM into coordinator instance
    cmds:
      - cd deploy/benchmark/terraform && tofu output -raw ssm_coordinator | bash

  # --- Distributed test harness (cmd/tpch-harness) ---

  harness:build:
    desc: Build the tpch-harness and wadjet binaries
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/tpch-harness ./cmd/tpch-harness
      - go build -o {{.DIST}}/wadjet ./cmd/wadjet

  harness:smoke:
    desc: Real-cluster smoke test against SF0.01 fixture (~30s)
    deps: [harness:build]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=local --slice=small --no-compare --queries=q01,q06 --wadjet-bin={{.DIST}}/wadjet"

  harness:local:
    desc: Local fast gate using the small slice (~1-2 min)
    deps: [harness:build]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=local --slice=small --wadjet-bin={{.DIST}}/wadjet"

  harness:large:
    desc: Local pre-merge gate using the large slice (forces spill, ~5-10 min)
    deps: [harness:build]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=local --slice=large --wadjet-bin={{.DIST}}/wadjet"

  harness:golden:
    desc: Run against an existing EC2 cluster (requires COORD_URL)
    deps: [harness:build]
    requires:
      vars: [COORD_URL]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=golden --coord-url={{.COORD_URL}} --update-baseline"

  harness:clean:
    desc: Remove all harness run dirs and built binaries
    cmds:
      - rm -rf /tmp/wadjet-harness
      - rm -rf {{.DIST}}
