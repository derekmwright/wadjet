version: "3"

tasks:
  build:
    desc: Build the wadjet binary
    cmds:
      - go build -o wadjet ./cmd/wadjet

  build-ingest:
    desc: Build the unifi-ingest binary
    cmds:
      - go build -o unifi-ingest ./cmd/unifi-ingest

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./internal/...

  test-race:
    desc: Run unit tests with race detector
    cmds:
      - go test -race ./internal/...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -run=^$ ./internal/engine/... ./internal/worker/...

  proto:
    desc: Regenerate protobuf and gRPC Go code
    cmds:
      - protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative proto/wadjet/v1/wadjet.proto

  check:
    desc: Run vet, lint, and tests
    cmds:
      - task: vet
      - task: lint
      - task: test
