version: "3"

# Every binary this repo builds lands in dist/, which is the only build
# artifact path .gitignore hides. Building to the repo root is what put a
# 59 MB binary inside the wadjet/ PACKAGE directory (go writes into a
# directory of that name rather than refusing) and required ignoring
# /wadjet — which then hid new source files in that package from
# `git status` entirely. Two test files were written, never shown as
# untracked, and never committed before that was noticed.
vars:
  DIST: dist
  # PostgreSQL differential oracle — see the pg-oracle:* tasks.
  PG_ORACLE_CONTAINER: wadjet-pg-oracle
  PG_ORACLE_PORT: 55432
  PG_ORACLE_IMAGE: postgres:17-alpine

tasks:
  build:
    desc: Build the wadjet binary into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/wadjet ./cmd/wadjet

  build-all:
    desc: Build every command into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/ ./cmd/...

  build-ingest:
    desc: Build the unifi-ingest binary into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/unifi-ingest ./cmd/unifi-ingest

  clean:
    desc: Remove built binaries
    cmds:
      - rm -rf {{.DIST}}

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./internal/...

  test-race:
    desc: Run unit tests with race detector
    cmds:
      - go test -race ./internal/...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -run=^$ ./internal/engine/... ./internal/worker/...

  proto:
    desc: Regenerate protobuf and gRPC Go code (public + internal)
    cmds:
      - protoc -I=proto --go_out=gen --go_opt=paths=source_relative --go-grpc_out=gen --go-grpc_opt=paths=source_relative wadjet/v1/wadjet.proto
      - protoc -I=proto --go_out=gen --go_opt=paths=source_relative --go-grpc_out=gen --go-grpc_opt=paths=source_relative dataplane/v1/dataplane.proto dataplane/v1/peer.proto

  check:
    desc: Run vet, lint, and tests
    cmds:
      - task: vet
      - task: lint
      - task: test

  # --- Benchmark deploy pipeline ---
  # Usage:
  #   task bench:stage PROFILE=sf100-distributed     # Build + upload binaries
  #   task bench:deploy PROFILE=sf100-distributed    # Stage + terraform apply
  #   task bench:teardown                             # Destroy infrastructure
  #   task bench:ssh                                  # SSM into coordinator

  bench:stage:
    desc: Cross-compile and stage binaries + profiles to S3
    requires:
      vars: [PROFILE]
    vars:
      BUCKET:
        sh: 'python3 -c "import yaml; p=yaml.safe_load(open(''deploy/benchmark/profiles/{{.PROFILE}}.yaml'')); print(p[''storage''][''bucket''])"'
      REGION:
        sh: 'python3 -c "import yaml; p=yaml.safe_load(open(''deploy/benchmark/profiles/{{.PROFILE}}.yaml'')); print(p[''storage''][''region''])"'
    cmds:
      - ./deploy/benchmark/stage-binaries.sh {{.BUCKET}} {{.REGION}}

  bench:deploy:
    desc: Stage binaries and deploy benchmark cluster from profile
    requires:
      vars: [PROFILE]
    cmds:
      - task: bench:stage
        vars: { PROFILE: "{{.PROFILE}}" }
      - cd deploy/benchmark/terraform && tofu apply -var="profile={{.PROFILE}}"

  bench:plan:
    desc: Show terraform plan for a benchmark profile (dry run)
    requires:
      vars: [PROFILE]
    cmds:
      - cd deploy/benchmark/terraform && tofu plan -var="profile={{.PROFILE}}"

  bench:teardown:
    desc: Destroy benchmark infrastructure
    cmds:
      - cd deploy/benchmark/terraform && tofu destroy

  bench:ssh:
    desc: SSM into coordinator instance
    cmds:
      - cd deploy/benchmark/terraform && tofu output -raw ssm_coordinator | bash

  # --- Distributed test harness (cmd/tpch-harness) ---

  harness:build:
    desc: Build the tpch-harness and wadjet binaries
    cmds:
      - mkdir -p {{.DIST}}
      - go build -o {{.DIST}}/tpch-harness ./cmd/tpch-harness
      - go build -o {{.DIST}}/wadjet ./cmd/wadjet

  harness:smoke:
    desc: Real-cluster smoke test against SF0.01 fixture (~30s)
    deps: [harness:build]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=local --slice=small --no-compare --queries=q01,q06 --wadjet-bin={{.DIST}}/wadjet"

  harness:local:
    desc: Local fast gate using the small slice (~1-2 min)
    deps: [harness:build]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=local --slice=small --wadjet-bin={{.DIST}}/wadjet"

  harness:large:
    desc: Local pre-merge gate using the large slice (forces spill, ~5-10 min)
    deps: [harness:build]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=local --slice=large --wadjet-bin={{.DIST}}/wadjet"

  harness:golden:
    desc: Run against an existing EC2 cluster (requires COORD_URL)
    deps: [harness:build]
    requires:
      vars: [COORD_URL]
    cmds:
      - "{{.DIST}}/tpch-harness --mode=golden --coord-url={{.COORD_URL}} --update-baseline"

  harness:clean:
    desc: Remove all harness run dirs and built binaries
    cmds:
      - rm -rf /tmp/wadjet-harness
      - rm -rf {{.DIST}}

  # --- PostgreSQL differential oracle (benchmarks/tpch/postgres_*_test.go) ---
  #
  # PostgreSQL is the authority on SEMANTICS for this engine, because Wadjet
  # ships the PostgreSQL wire protocol. The suite has two arms: the corpus
  # compared value-for-value, and the SAME SQL compared at the WIRE (type OIDs,
  # format codes, RowDescription, NULL representation, SQLSTATE, command tag).
  #
  # `task pg-oracle:test` needs no setup at all when the postgres image is on
  # the machine — the test starts and tears down its own container. These
  # targets are for keeping ONE server across many runs, which is what you want
  # while iterating on a fix.
  #
  # The database is initdb'd --locale=C on purpose: Wadjet compares strings by
  # BYTES and a default en_US database compares them by locale, which would
  # report every correct string ORDER BY as a divergence. See postgresCollation
  # in benchmarks/tpch/postgres_oracle_test.go.

  pg-oracle:up:
    desc: Start a PostgreSQL oracle container and print its DSN
    cmds:
      - docker rm -f {{.PG_ORACLE_CONTAINER}} 2>/dev/null || true
      - >
        docker run -d --name {{.PG_ORACLE_CONTAINER}}
        -e POSTGRES_USER=wadjet -e POSTGRES_PASSWORD=wadjet -e POSTGRES_DB=wadjet_oracle
        -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8"
        -p 127.0.0.1:{{.PG_ORACLE_PORT}}:5432 {{.PG_ORACLE_IMAGE}}
        -c fsync=off -c full_page_writes=off -c synchronous_commit=off
      - until docker exec {{.PG_ORACLE_CONTAINER}} pg_isready -U wadjet -q; do sleep 1; done
      - 'echo "WADJET_PG_DSN=postgres://wadjet:wadjet@127.0.0.1:{{.PG_ORACLE_PORT}}/wadjet_oracle?sslmode=disable"'

  pg-oracle:down:
    desc: Remove the PostgreSQL oracle container
    cmds:
      - docker rm -f {{.PG_ORACLE_CONTAINER}} 2>/dev/null || true

  pg-oracle:test:
    desc: Run the PostgreSQL differential oracle (SF0.01; starts its own container if none is given)
    cmds:
      - go test -v -run 'TestPostgresOracle$' -timeout 30m ./benchmarks/tpch/

  pg-oracle:test-decimal:
    desc: Run the oracle over the spec-conformant TPC-H DECIMAL(15,2) fixture (ADR-0024)
    cmds:
      - TPCH_DECIMAL=1 go test -v -run 'TestPostgresOracle$' -timeout 30m ./benchmarks/tpch/

  pg-oracle:test-large:
    desc: 'Run the oracle at a larger tier, e.g. task pg-oracle:test-large SCALE=1 (SF1 loads ~7.7M rows)'
    vars:
      SCALE: '{{.SCALE | default "0.1"}}'
    cmds:
      - WADJET_PG_SCALE={{.SCALE}} go test -v -run 'TestPostgresOracle$' -timeout 120m ./benchmarks/tpch/

  # --- SQLancer adversarial harness (tools/sqlancer/) ---
  #
  # See tools/sqlancer/README.md for the full runbook. SQLancer is GPLv3 and
  # deliberately never vendored — sqlancer:build clones it fresh into a
  # scratch dir. `task sqlancer:run` (not a raw `java -jar`) is the
  # supported way to launch it: it always runs from a scratch working
  # directory, never the caller's cwd — see tools/sqlancer/run.sh's header
  # comment for why that matters.

  sqlancer:build:
    desc: 'Clone, patch, and build the SQLancer jar (default target-dir /tmp/sqlancer-wadjet)'
    vars:
      TARGET_DIR: '{{.TARGET_DIR | default "/tmp/sqlancer-wadjet"}}'
    cmds:
      - tools/sqlancer/build.sh {{.TARGET_DIR}}

  sqlancer:run:
    desc: 'Run one SQLancer invocation from a scratch dir, e.g. task sqlancer:run ARGS="--num-threads 1 --random-seed 1 --num-queries 1000 --username wadjet --password \$PGPASSWORD wadjet --oracle NOREC --test-collations=false --connection-url postgresql://localhost:15432/wadjet"'
    requires:
      vars: [ARGS]
    cmds:
      # ARGS is deliberately UNQUOTED: it's a space-separated list of
      # distinct java/SQLancer flags (see the desc above), and run.sh
      # needs each one as its own argv entry. Quoting it collapses the
      # whole thing into a single argument instead (verified: `task ...
      # ARGS="--oracle NOREC --num-queries 10"` then reaches run.sh as
      # one literal string containing spaces) — silently breaking every
      # documented invocation instead of hardening this one.
      - tools/sqlancer/run.sh {{.ARGS}}

  sqlancer:triage:
    desc: 'Classify SQLancer soak-log output into genuine oracle violations vs crash echoes vs noise, e.g. task sqlancer:triage LOGS="/tmp/sqlancer-soak"'
    requires:
      vars: [LOGS]
    cmds:
      - go run ./cmd/sqlancer-triage "{{.LOGS}}"
