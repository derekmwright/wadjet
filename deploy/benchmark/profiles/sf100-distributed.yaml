# SF100 Distributed — 3-worker TPC-H benchmark at full scale
#
# Full-scale benchmark for OOM/spill validation and competitive comparison.
# Data copied from Polars public bucket into our account, stored at ROOT
# level (lineitem/, orders/, etc.) — NOT under tables/ prefix.
# Workers use c7gd.4xlarge for NVMe spill-to-disk.
#
# Coordinator: c7g.2xlarge  (8 vCPU, 16 GB)
# Workers:     c7gd.4xlarge (16 vCPU, 32 GB, 1x237 GB NVMe) x3

name: SF100 Distributed
description: 3-worker TPC-H SF100 for OOM/spill validation

storage:
  bucket: wadjet-bench-sf100-use2
  region: us-east-2
  # IMPORTANT: SF100 data is at root level, not under tables/.
  # The bucket contains: lineitem/, orders/, customer/, etc.
  data_prefix: ""

cluster:
  mode: distributed
  workers: 3
  coordinator_instance: c7g.2xlarge
  worker_instance: c7gd.4xlarge
  arch: arm64
  use_spot: false

benchmark:
  scale_factor: 100
  # Base-table NVMe cache: 150 GB of the workers' 237 GB instance store.
  # SF100-validated 2026-08-09 (pair 20260809-212321/214810): suite
  # -37.8% cold / -35.5% steady, cluster NIC rx 908->137 GB (-85%),
  # inbound ENA throttle events -86%, rows 44/44 identical. Disable
  # with -var=base_table_cache_bytes=0.
  base_table_cache_bytes: 161061273600
  # Decoded row-group chunk cache (docs/design/decoded-rowgroup-cache.md
  # §9.4): 6 GiB/worker heap cache of decoded parquet column chunks.
  # SF100 pair 2026-08-12 (bin f251178, worst ENA window of the night):
  # pair -14.4%, R1 -20.4% / R2 -10.1%, rows 44/44 identical; pressure
  # valve engaged (shed WARNs). Reproduce cache-less with
  # -var=decoded_cache_bytes=0.
  decoded_cache_bytes: 6442450944
  runs: 1
  query_timeout: 30m
  skip_load: true
  # The four knobs below were tfvars-only until 2026-08-14, when three
  # profile-driven deploys silently ran without them (NATS data plane,
  # unpaced uploads, s2 wire, no locality) and produced an afternoon of
  # stall-storm windows — see docs/benchmarks/width-growcap-3arm-2026-08-14.md
  # §3. Keep profile and sf100-distributed.tfvars in agreement.
  # gRPC data plane (task dispatch/results/gather); NATS keeps heartbeats
  # + cancellation + KV. SF100 is where NATS-plane pathologies live.
  data_plane: grpc
  # Input-locality task placement (docs/design/locality-placement.md).
  locality_placement: true
  # Aggregate background PUT budget, MB/s (upload-burst-smoothing §5;
  # c7gd.4xlarge ENA baseline ≈ 234 MB/s).
  upload_pace_mbps: 150
  # zstd WSHZ upload envelope (exchange-zstd-wire §6): upload bytes −19%,
  # zero stall firings vs 13 on the same-window s2 arm (2026-08-14 pair).
  exchange_zstd: 1
  # Restore the post-discovery catalog from s3://<bucket>/catalog/ instead
  # of re-running discovery + ANALYZE every deploy. First deploy with this
  # set pays the full cost once and writes the snapshot; later deploys
  # restore in seconds. Safe while the bucket's table data is immutable;
  # delete s3://<bucket>/catalog/ after changing it.
  catalog_snapshot_prefix: "catalog/"
