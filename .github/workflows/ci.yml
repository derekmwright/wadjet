name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Add ready_for_review so CI fires when a draft PR is marked ready
    # (default types are [opened, synchronize, reopened]). The job-level
    # `if` gate skips CI while the PR is still draft.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip CI on draft PRs — iteration on feat branches is rapid and runs
    # are 3+ min; CI fires automatically once the PR is marked ready.
    # Pushes to main always run (event_name == 'push' bypasses this gate).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Docs Link Check
        # Resolves every relative link and #anchor in README.md, docs/**/*.md,
        # and CONTRIBUTING.md against the tree, and asserts every docs/*.md
        # page is reachable from docs/README.md. Pure filesystem/regex work
        # over ~165 files — a few hundred ms, no fixtures or servers needed.
        run: go run ./tools/docscheck .

      - name: Unit Tests
        # -short skips heavy SF0.3 Polars/multi-cache-file local repro tests
        # that exist for hunting SF100 distributed bugs offline. They each
        # spin up a multi-worker embedded NATS coordinator and easily push
        # the 7 GB hosted runner past its memory limit when run alongside
        # the rest of the suite in parallel.
        # -p 2 caps test-package parallelism so two heavy packages don't
        # overlap on the runner's RAM.
        # ./wadjet/ carries the embeddable-API E2E suites (CTE, nested
        # types, Decimal) — it was previously not run in CI at all.
        # ./test/ carries the SQL-level E2E regression suites (dates,
        # vectors, lateral joins) — also previously unrun: the vector
        # distance panic (String-typed kernel output) sat unnoticed there
        # for seven weeks.
        run: go test -short -p 2 ./internal/... ./wadjet/ ./test/ -timeout 8m

      - name: Race Detector (planner + executor concurrency)
        # Nothing ran under -race before issue #334, and that is how a plain
        # scalar-subquery query shipped able to kill the process: a shared
        # planner map written from the parallel pipeline's goroutines, which
        # the runtime turns into an uncatchable "fatal error: concurrent map
        # writes". The race detector reports it in under a second.
        # Scoped to the packages that fan out across goroutines rather than
        # the whole tree, so the step stays cheap enough to always run.
        run: go test -race -run 'Concurrent|Parallel|Race' ./internal/planner/... ./internal/engine/exec/ -timeout 10m

      - name: TPC-H Correctness (SF0.01)
        run: go test -v -run TestTPCHQueries ./benchmarks/tpch/ -timeout 5m

      - name: Optimization-Invariance Oracle (SF0.01)
        # Kill-switch differential (#287): every query re-run with each
        # registered optimization disabled must produce identical results.
        # A failing subtest names the diverging optimization.
        run: go test -v -run TestTPCHOptimizationInvariance ./benchmarks/tpch/ -timeout 10m

      - name: Standalone-vs-Distributed Differential (SF0.01)
        # Randomized differential (#288): seeded generated queries run in
        # a single process and in a 3-worker cluster; results must match.
        # Bounded seed range in CI; longer campaigns via
        # WADJET_DIFF_SEED_START/COUNT.
        run: go test -v -run TestStandaloneVsDistributedDifferential ./internal/coordinator/ -timeout 15m

      - name: Type-Matrix Coverage Gates (all 22 column types)
        # The gates TPC-H and ClickBench are structurally blind to: their
        # corpora carry three storage types (Int32, Float64, String), so a
        # defect that needs a BYTES, IPv4, UUID, DECIMAL or nested column to
        # fire cannot be seen by any of them. Vector.GetValue's TypeBytes arm
        # aliasing the column arena (#391) shipped through every existing gate
        # for exactly that reason.
        #
        #   NoProcessKillers  — the set of queries that take the process down,
        #                       found by re-execing a child per killer.
        #   BatchReuse        — poisoned pool vs clean pool: the contract that
        #                       a pooled batch's storage is undefined after
        #                       Release() (#391, #398, #399).
        #   OptimizationInvariance / Fuzz* — #287's kill-switch differential
        #                       and generated SQL, over all 22 types.
        #   TwoPath           — stage DAG vs single process, per type (#396);
        #                       PredicateSemanticsTwoPath holds each arm to
        #                       SQL-computed truth instead of to the other
        #                       arm (#461/#450) and MinByTwoPath does the
        #                       same for MIN_BY/MAX_BY.
        #
        # The second line was 'TestTypeMatrixTwoPath', an unanchored regexp
        # that happened to match only the one test of that exact name — so
        # PredicateSemanticsTwoPath and MinByTwoPath never ran here, and
        # -short (the Unit Tests step above) skips them too. Broadened to
        # 'TestTypeMatrix' so every TwoPath gate in the package runs.
        #
        # TestQueryPanicBoundaryHoldsForEveryShape is joined to this step by
        # name, not left to the regex above: it is a process-killer gate like
        # TestTypeMatrixNoProcessKillers, it skips itself under -short (so the
        # Unit Tests step above never runs it), and 'TestTypeMatrix' does not
        # match it. Without this line the whole panic-boundary gate was dead
        # in CI while passing locally.
        run: |
          go test -v -run 'TestTypeMatrix|TestQueryPanicBoundary' ./wadjet/ -timeout 15m
          go test -v -run 'TestTypeMatrix' ./internal/coordinator/ -timeout 15m

      - name: Fuzz Seed Corpora (parquet decoders)
        # There was no fuzz step at all, so every target in the tree only ran
        # when somebody remembered to. The decoders parse bytes the engine
        # did NOT write — a parquet file's footer and page headers are claims
        # about a file that does not have to honour them — and the crashers
        # that class produced were process kills: five footer offsets used
        # directly as slice indices (r.data[-9025:]), a page loop walking
        # past the row group's own row count, a negative num_rows reaching
        # makeslice.
        #
        # This runs the SEED CORPORA only (no -fuzz), which is a few seconds
        # and completely deterministic: every crasher found so far is a seed,
        # so a regression fails here by name. Live fuzzing stays a local /
        # scheduled activity — a randomized gate that can fail an unrelated
        # PR is a gate people learn to re-run rather than read.
        run: |
          go test -run 'Fuzz|TestWholeFileMutationCrashers' \
            ./internal/storage/parquet/ ./internal/engine/scan/ \
            ./internal/planner/sql/ ./internal/worker/ -timeout 5m

      - name: Nested Types + Decimal Correctness
        # The gate TPC-H is structurally blind to (issue #144): TPC-H has
        # no ARRAY/MAP/ROW columns, no Decimal in the merge path, and no
        # NULL group keys, so an entire class of silent wrong-results bugs
        # shipped SF100-green until found by code sweep. These suites run
        # the nested+Decimal battery end-to-end (embeddable API and
        # distributed) plus the operator-level regression corpus.
        run: |
          go test -v -run 'TestNestedDecimalCorrectness' ./wadjet/ -timeout 5m
          go test -v -run 'TestDistributedDecimalAndNullGroups' ./internal/coordinator/ -timeout 5m
          go test -v -run 'TestReadRowGroupNative_DecimalValues|TestReadRowGroupNative_ArrayErrorsLoudly|TestShuffleFormatDecimalScaleRoundTrip|TestStringGroupKey_NullGroupAggregates|TestDecimal' ./internal/engine/scan/ ./internal/worker/ ./internal/engine/exec/ ./internal/storage/parquet/ -timeout 5m

  benchmark:
    runs-on: ubuntu-latest
    # Same draft gate as the test job: skip the 30-min SF1 bench while a
    # PR is still in draft.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: TPC-H SF1 Benchmark
        run: |
          TPCH_SCALE=1 go test -v -run TestTPCHQueriesLarge -timeout 30m ./benchmarks/tpch/ 2>&1 | tee /tmp/bench.txt
          echo "## TPC-H SF1 Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(Q[0-9]+|TOTAL|PASS|FAIL)" /tmp/bench.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
