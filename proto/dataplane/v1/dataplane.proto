syntax = "proto3";

package wadjet.dataplane.v1;

option go_package = "github.com/citc-tech/wadjet/gen/dataplane/v1;dataplanev1";

// DataPlane is the worker↔coord transport for high-rate operational
// traffic that NATS JetStream is a poor fit for at scale: task dispatch,
// result batches, gather payloads, and per-task progress.
//
// Out of scope for this service (stays on NATS): heartbeats, query
// cancellation broadcast, catalog/UDF KV, DLQ. See
// project_split_plane_design_2026-05-20.md for the full design and
// rationale.
//
// Phase A defines the connection bootstrap only (Hello/Welcome). The
// streaming RPCs that carry tasks and results are added in Phases B–E.
service DataPlane {
  // Worker opens a long-lived bidi stream to the coordinator. The first
  // message in each direction is Hello/Welcome; subsequent messages
  // multiplex task dispatch, results, progress, and completion over
  // the same stream.
  rpc Connect(stream WorkerEnvelope) returns (stream CoordEnvelope);
}

// WorkerEnvelope is the worker→coord direction of the bidi stream.
// Phase B added ResultBatch. Phase E added TaskProgress so the
// liveness signal shares fate with results (heap-pinned worker that
// can't deliver results also can't deliver progress, so coord redispatches).
message WorkerEnvelope {
  oneof msg {
    Hello hello = 1;
    ResultBatch result_batch = 2;
    TaskProgress task_progress = 3;
    // reserved: TaskComplete, TaskFailed (future).
  }
  reserved 4 to 15;
}

// CoordEnvelope is the coord→worker direction. Phase C adds
// TaskDispatch (the load-bearing change in the migration); CancelTask
// stays on NATS pub/sub in Phase C and may move later.
message CoordEnvelope {
  oneof msg {
    Welcome welcome = 1;
    TaskDispatch task_dispatch = 2;
    // reserved: CancelTask. See phase D+ design.
  }
  reserved 3 to 15;
}

// Hello is the worker's introduction. Coord uses it to register the
// worker, bind capabilities to the scheduler, and pin a build_sha for
// compatibility checks.
message Hello {
  string worker_id   = 1;
  string build_sha   = 2;
  int32  num_cpus    = 3;
  int64  gomemlimit  = 4;
}

// Welcome is the coord's reply. Carries cluster identity and any
// initial config the worker needs.
message Welcome {
  string cluster_id  = 1;
  int64  server_time = 2; // unix nanos
}

// ResultBatch is a chunk of a query's gather output, sent from worker
// to coord. Mirrors distributed.GatherBatchMsg on the NATS path so the
// receive-side can reuse the same WSHF decoder.
//
// Routing: coord uses query_id to dispatch the batch to the right
// gatherReceiver. WSHF payload is self-contained (magic + schema +
// rows + nulls) — the gRPC framing is just transport.
//
// Terminal=true marks the last batch from this worker for this query.
// If err is non-empty, the task failed and the partial output (if any)
// is discarded by the receiver.
message ResultBatch {
  string query_id  = 1;
  string worker_id = 2;
  bool   terminal  = 3;
  int32  row_count = 4;
  bytes  payload   = 5; // WSHF-encoded
  string err       = 6; // non-empty on task failure (terminal=true)
}

// TaskDispatch is one unit of work coord pushes to a worker. The body
// is an opaque blob — distributed.Marshal(Task) on the coord side,
// distributed.Unmarshal on the worker side — because the Task struct
// has too many fields and too much churn to express in proto. gRPC
// just carries the bytes.
//
// task_id, query_id, stage_id are duplicated outside the blob so the
// dispatcher and progress paths can route without unmarshaling. They
// MUST match the values inside task_blob; worker-side code uses the
// blob for execution and the outer fields for routing/logging only.
//
// Idempotency: workers de-dupe on task_id. Coord may redispatch the
// same task_id after a TCP disconnect; duplicate completions are
// dropped by the result handler.
message TaskDispatch {
  string task_id           = 1;
  string query_id          = 2;
  string stage_id          = 3;
  bytes  task_blob         = 4;
  int64  deadline_unix_nano = 5; // 0 = no explicit deadline
}

// TaskProgress is the per-task liveness + throughput signal workers
// emit from their hot loops (~2 s cadence, advisory). Coord consumes
// it for two purposes:
//   1. WorkerRegistry liveness — any TaskProgress proves the worker
//      goroutine is alive even if the global heartbeat is starved by
//      GC mark-assist (Q03 SF10 2026-04-29 motivation for the
//      multi-signal liveness work).
//   2. Per-stage awaitStageProgress — bridge fans messages out to the
//      stage's progress channel for "no row progress for N seconds"
//      stall detection.
//
// rows_processed / bytes_processed are monotonic over the task's
// lifetime; coord computes throughput as deltas across consecutive
// messages from the same task_id.
message TaskProgress {
  string query_id              = 1;
  string stage_id              = 2;
  string task_id               = 3;
  string worker_id             = 4;
  int64  rows_processed        = 5;
  int64  bytes_processed       = 6;
  int64  timestamp_unix_nano   = 7;
}
